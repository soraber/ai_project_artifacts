<text x="57" y="212" class="stage-detail" text-anchor="start">3,200 Wikipedia rows</text>
<text x="57" y="250" class="stage-detail" text-anchor="start">900 chars / 120 overlap</text>
<text x="57" y="288" class="stage-detail" text-anchor="start">3,492 stable chunk IDs</text>
<line x1="272" y1="238" x2="287" y2="238" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
