<rect x="553" y="128" width="8" height="220" rx="4" fill="#b45309"/>
<text x="575" y="166" class="stage-title" text-anchor="start">3. Expand query</text>
<text x="575" y="212" class="stage-detail" text-anchor="start">hyde_prompt()</text>
<text x="575" y="250" class="stage-detail" text-anchor="start">generate_batch()</text>
<text x="575" y="288" class="stage-detail" text-anchor="start">raw + hypothetical text</text>
<line x1="790" y1="238" x2="805" y2="238" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
