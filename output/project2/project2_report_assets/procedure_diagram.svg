<text x="316" y="212" class="stage-detail" text-anchor="start">E5Encoder.encode()</text>
<text x="316" y="250" class="stage-detail" text-anchor="start">FAISS IndexFlatIP</text>
<text x="316" y="288" class="stage-detail" text-anchor="start">lexical_tokens() + BM25</text>
<line x1="531" y1="238" x2="546" y2="238" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
