<text x="1352" y="212" class="stage-detail" text-anchor="start">retrieval_metrics()</text>
<text x="1352" y="250" class="stage-detail" text-anchor="start">token_f1()</text>
<text x="1352" y="288" class="stage-detail" text-anchor="start">citation_validity()</text>
