<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img">
<title>Project 2: RAG Document QA Procedure</title>
<desc>Dense baseline versus HyDE, hybrid retrieval, fusion, and reranking. Methods, functions, and evaluation metrics are shown.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
  </marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #475569; }
    .section { font-size: 14px; font-weight: 700; fill: #64748b; letter-spacing: 1px; }
    .stage-title { font-size: 20px; font-weight: 700; }
    .stage-detail { font-size: 15px; fill: #334155; }
    .metric-title { font-size: 15px; font-weight: 600; fill: #cbd5e1; }
    .metric-value { font-size: 18px; font-weight: 700; fill: #ffffff; }
  </style>
</defs>
<rect width="1600" height="540" fill="#ffffff"/>
<text x="35" y="48" class="title" text-anchor="start">Project 2: RAG Document QA Procedure</text>
<text x="35" y="78" class="subtitle" text-anchor="start">Dense baseline versus HyDE, hybrid retrieval, fusion, and reranking</text>
<text x="35" y="109" class="section" text-anchor="start">METHODS AND FUNCTIONS</text>
