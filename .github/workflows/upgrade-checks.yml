name: Upgrade Evaluation Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements-upgrade-cpu.hashes.txt
      - run: python -m pip check
      - run: python -m pytest -q tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: |
          python -m venv .audit
          .audit/bin/pip install pip-audit==2.10.1
          .audit/bin/pip-audit --disable-pip -r requirements-upgrade-cpu.hashes.txt
